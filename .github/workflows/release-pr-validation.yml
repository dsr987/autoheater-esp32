name: Validate release metadata
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to validate (manual run)"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release label and changelog
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PR_NUMBER:-}" ]]; then
            echo "::error::PR_NUMBER is required for both pull_request and workflow_dispatch events."
            exit 1
          fi
          # Read labels/body from the GitHub API for both event types. This avoids
          # relying on pull_request.labels expression expansion, which may be empty.
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          export PR_LABELS="$(python3 -c 'import json,sys; print(",".join(x["name"] for x in json.load(open(sys.argv[1])).get("labels", [])))' "$RUNNER_TEMP/pr.json")"
          export PR_BODY="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("body") or "")' "$RUNNER_TEMP/pr.json")"
          echo "Validating PR #$PR_NUMBER; release labels: ${PR_LABELS:-<none>}"
          python3 tools/release_automation.py validate-pr
