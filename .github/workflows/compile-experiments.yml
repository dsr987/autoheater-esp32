name: Сборка экспериментальных скетчей ESP32

on:
  push:
    branches:
      - main
    paths:
      - "experiments/**/*.ino"
      - "experiments/**/*.cpp"
      - "experiments/**/*.h"
      - ".github/workflows/compile-experiments.yml"
  pull_request:
    branches:
      - main
    paths:
      - "experiments/**"
      - ".github/workflows/compile-experiments.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    name: Компиляция всех скетчей из experiments
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Установить Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Настроить Arduino CLI
        run: arduino-cli config init

      # Keep the toolchain and async OTA libraries aligned with the known-good
      # build configuration in dsr987/lego-technic-esp32.
      - name: Установить платформу ESP32
        run: |
          set -Eeuo pipefail
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.9

      - name: Установить библиотеки
        run: |
          set -Eeuo pipefail
          arduino-cli lib update-index
          arduino-cli lib install \
            "ESPAsyncWebServer@3.1.0" \
            "AsyncTCP@1.1.4" \
            "ElegantOTA@3.1.0" \
            "Adafruit SSD1306" \
            "Adafruit GFX Library" \
            "Adafruit BusIO"

      - name: Скомпилировать каждый экспериментальный скетч
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          mkdir -p build-artifacts
          count=0
          failed=0

          while IFS= read -r -d '' ino; do
            count=$((count + 1))
            sketch_dir="$(dirname "$ino")"
            ino_name="$(basename "$ino" .ino)"
            dir_name="$(basename "$sketch_dir")"

            echo "::group::Сборка $ino"

            if [[ "$ino_name" != "$dir_name" ]]; then
              echo "::error file=$ino::Имя файла $ino_name.ino должно совпадать с именем папки $dir_name"
              failed=$((failed + 1))
              echo "::endgroup::"
              continue
            fi

            # Keep compiler intermediates outside the repository.
            output_dir="$RUNNER_TEMP/esp32-build/$ino_name"
            mkdir -p "$output_dir"

            if arduino-cli compile \
              --fqbn esp32:esp32:esp32 \
              --warnings default \
              --build-property "compiler.cpp.extra_flags=-DELEGANTOTA_USE_ASYNC_WEBSERVER=1" \
              --output-dir "$output_dir" \
              "$sketch_dir"; then
              compiled_bin="$output_dir/$ino_name.ino.bin"
              if [[ ! -s "$compiled_bin" ]]; then
                echo "::error file=$ino::Компилятор не создал ожидаемый BIN-файл $compiled_bin"
                failed=$((failed + 1))
                echo "::endgroup::"
                continue
              fi

              named_bin="$sketch_dir/$ino_name.bin"
              cp "$compiled_bin" "$named_bin"

              artifact_dir="build-artifacts/$(dirname "${ino#experiments/}")"
              mkdir -p "$artifact_dir"
              cp "$named_bin" "$artifact_dir/$ino_name.bin"
              echo "Успешно: $sketch_dir/$ino_name.bin"
            else
              echo "::error file=$ino::Ошибка компиляции скетча $ino"
              failed=$((failed + 1))
            fi

            echo "::endgroup::"
          done < <(find experiments -type f -name '*.ino' -not -path '*/build/*' -print0 | sort -z)

          if [[ "$count" -eq 0 ]]; then
            echo "В папке experiments не найдено файлов .ino."
            exit 0
          fi

          echo "Всего найдено скетчей: $count; ошибок: $failed"
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

      - name: Сохранить BIN-файлы в репозитории
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while IFS= read -r -d '' bin; do
            git add -f -- "$bin"
          done < <(find experiments -type f -name '*.bin' -not -path '*/build/*' -print0 | sort -z)

          if git diff --cached --quiet; then
            echo "BIN-файлы не изменились; новый коммит не нужен."
            exit 0
          fi

          git commit -m "Обновить бинарники экспериментов ESP32"
          git push

      - name: Опубликовать бинарные файлы
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32-experiments-bin
          path: build-artifacts/**/*.bin
          if-no-files-found: warn
          retention-days: 30
