name: Firmware CI and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify generated metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/extract_changelog.py
          python3 tools/update_readme_version.py
          git diff --exit-code -- CHANGELOG.md README.md

      - name: Prepare factory sketch
        run: |
          set -euo pipefail
          python3 tools/prepare_factory.py
          git diff --exit-code -- factory/

      - name: Install ESP32 Python dependency
        run: python -m pip install pyserial

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 platform
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.9

      - name: Install libraries
        run: |
          set -euo pipefail
          arduino-cli lib update-index
          arduino-cli lib install "AsyncTCP@1.1.4"
          arduino-cli lib install "ESPAsyncWebServer@3.1.0"
          arduino-cli lib install "ElegantOTA@3.1.0"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit BusIO"

      - name: Compile firmware and factory image
        run: |
          set -euo pipefail
          mkdir -p dist "$RUNNER_TEMP/factory-build"
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --build-property compiler.cpp.extra_flags="-DELEGANTOTA_USE_ASYNC_WEBSERVER=1" \
            --build-path "$RUNNER_TEMP/factory-build" \
            factory

          BUILD="$RUNNER_TEMP/factory-build"
          test -s "$BUILD/factory.ino.bin"
          test -s "$BUILD/factory.ino.bootloader.bin"
          test -s "$BUILD/factory.ino.partitions.bin"
          ESPTOOL="$(find "$HOME/.arduino15/packages/esp32/tools/esptool_py" -type f -name esptool.py -print -quit)"
          BOOT_APP0="$HOME/.arduino15/packages/esp32/hardware/esp32/2.0.9/tools/partitions/boot_app0.bin"
          test -s "$ESPTOOL"
          test -s "$BOOT_APP0"

          APP_SIZE="$(stat -c%s "$BUILD/factory.ino.bin")"
          OTA_SLOT_SIZE=$((0x1E0000))
          if [ "$APP_SIZE" -gt "$OTA_SLOT_SIZE" ]; then
            echo "::error::Firmware image ($APP_SIZE bytes) exceeds OTA slot ($OTA_SLOT_SIZE bytes)"
            exit 1
          fi

          cp "$BUILD/factory.ino.bin" dist/autoheater-esp32.bin
          python3 "$ESPTOOL" --chip esp32 merge_bin \
            -o dist/factory.bin \
            0x1000 "$BUILD/factory.ino.bootloader.bin" \
            0x8000 "$BUILD/factory.ino.partitions.bin" \
            0xE000 "$BOOT_APP0" \
            0x10000 "$BUILD/factory.ino.bin"
          test -s dist/factory.bin
          FACTORY_SIZE="$(stat -c%s dist/factory.bin)"
          if [ "$FACTORY_SIZE" -gt 4194304 ]; then
            echo "::error::Factory image exceeds 4 MiB flash size ($FACTORY_SIZE bytes)"
            exit 1
          fi
          sha256sum dist/autoheater-esp32.bin > dist/autoheater-esp32.bin.sha256
          sha256sum dist/factory.bin > dist/factory.bin.sha256

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*\*[[:space:]]*FIRMWARE_VERSION:[[:space:]]*//p' App.ino | head -n 1 | tr -d '\r')"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match App.ino version v$version"
            exit 1
          }

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoheater-esp32-firmware
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: autoheater-esp32-firmware
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Autoheater ESP32 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/autoheater-esp32.bin
            dist/autoheater-esp32.bin.sha256
            dist/factory.bin
            dist/factory.bin.sha256
          fail_on_unmatched_files: true
          make_latest: true
