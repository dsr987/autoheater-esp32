name: Firmware CI and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a versioned GitHub Release after a successful build"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      firmware_version: ${{ steps.firmware_version.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read firmware version
        id: firmware_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 'FIRMWARE_VERSION:' App.ino | sed 's/.*FIRMWARE_VERSION: //')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify generated metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/extract_changelog.py
          python3 tools/update_readme_version.py
          git diff --exit-code -- CHANGELOG.md README.md

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino ESP32 platform
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: esp32-core-2.0.9-${{ runner.os }}
          restore-keys: |
            esp32-core-2.0.9-${{ runner.os }}-

      - name: Install ESP32 platform
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          installed=false
          for attempt in 1 2 3 4 5; do
            if arduino-cli core install esp32:esp32@2.0.9; then
              installed=true
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 20))
              echo "ESP32 core download failed; retrying in ${delay}s ($attempt/5)..."
              sleep "$delay"
            fi
          done
          if [ "$installed" != true ]; then
            echo "::error::ESP32 Arduino Core installation failed after 5 attempts"
            exit 1
          fi

      - name: Install ESP32 Python dependency
        run: python -m pip install pyserial

      - name: Install libraries
        run: |
          set -euo pipefail
          arduino-cli lib update-index
          arduino-cli lib install "AsyncTCP@1.1.4"
          arduino-cli lib install "ESPAsyncWebServer@3.1.0"
          arduino-cli lib install "ElegantOTA@3.1.0"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit BusIO"

      - name: Prepare project sketch
        run: python3 tools/prepare_sketch.py "$RUNNER_TEMP/Autoheater"

      - name: Compile Autoheater firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist "$RUNNER_TEMP/autoheater-build"
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --build-property compiler.cpp.extra_flags="-DELEGANTOTA_USE_ASYNC_WEBSERVER=1" \
            --build-path "$RUNNER_TEMP/autoheater-build" \
            "$RUNNER_TEMP/Autoheater"

          BUILD="$RUNNER_TEMP/autoheater-build"
          APP="$BUILD/Autoheater.ino.bin"
          test -s "$APP"

          APP_SIZE="$(stat -c%s "$APP")"
          OTA_SLOT_SIZE=$((0x140000))
          if [ "$APP_SIZE" -gt "$OTA_SLOT_SIZE" ]; then
            echo "::error::Autoheater app ($APP_SIZE bytes) exceeds Basic OTA slot ($OTA_SLOT_SIZE bytes)"
            exit 1
          fi

          cp "$APP" dist/autoheater-esp32.bin
          sha256sum dist/autoheater-esp32.bin > dist/autoheater-esp32.bin.sha256

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*\*[[:space:]]*FIRMWARE_VERSION:[[:space:]]*//p' App.ino | head -n 1 | tr -d '\r')"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match App.ino version v$version"
            exit 1
          }

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoheater-esp32-firmware
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: autoheater-esp32-firmware
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.build.outputs.firmware_version) }}
          target_commitish: ${{ github.sha }}
          name: Autoheater ESP32 ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.build.outputs.firmware_version) }}
          generate_release_notes: true
          files: |
            dist/autoheater-esp32.bin
            dist/autoheater-esp32.bin.sha256
          fail_on_unmatched_files: true
          make_latest: true
