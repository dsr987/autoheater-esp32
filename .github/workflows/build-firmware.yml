name: Build firmware
on:
  push:
    branches: [main]
    paths: ['firmware/**', '.github/workflows/**']
  pull_request:
    paths: ['firmware/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Configure ESP32 platform
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.9
      - name: Install libraries
        run: |
          arduino-cli lib install "AsyncTCP"
          arduino-cli lib install "ESPAsyncWebServer@3.1.0"
          arduino-cli lib install "ElegantOTA@3.1.0"
      - name: Compile application
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir "$RUNNER_TEMP/app-build" firmware/app
      - name: Package OTA binary
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/app-build/app.ino.bin" dist/autoheater-esp32.bin
          sha256sum dist/autoheater-esp32.bin > dist/autoheater-esp32.bin.sha256
      - name: Compile bootstrap
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --build-property compiler.cpp.extra_flags="-DELEGANTOTA_USE_ASYNC_WEBSERVER=1" --output-dir "$RUNNER_TEMP/bootstrap-build" firmware/bootstrap/Autoheater_ESP32_Bootstrap
      - uses: actions/upload-artifact@v4
        with:
          name: autoheater-esp32-firmware
          path: |
            dist/autoheater-esp32.bin
            dist/autoheater-esp32.bin.sha256
            ${{ runner.temp }}/bootstrap-build/Autoheater_ESP32_Bootstrap.ino.bin
          if-no-files-found: error
          retention-days: 30
